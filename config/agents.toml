# The agent registry. Adding a backend is a config change, not a code change.
#
# Two backend types exist:
#   container    -- docker exec into a persistent, named container
#   http_openai  -- POST to an OpenAI-compatible /chat/completions endpoint
#
# NO SECRET VALUES HERE. `secrets_dir` names a host directory that
# bootstrap.sh fills from 1Password; the container mounts only its own.

[agents.claude-code]
type = "container"
description = "Coding work: reading, editing and testing code in a repository. Runs sandboxed in a container, so it works autonomously but cannot reach the machine itself. The default choice for anything involving files."
container = "orch-claude-code"
# Where this agent's credentials are materialised on the host (tmpfs, 0700)
# and mounted read-only into its container at /run/secrets. Per-agent, so
# claude-code cannot read hermes's identity or vice versa.
secrets_dir = "/run/orchestration/secrets/claude-code"
# No default repository on purpose. An unnamed job gets a scratch
# directory, not somebody's codebase: defaulting to one meant a vague
# request quietly started editing whichever repo happened to be first in
# the file. Name the repo when you want one.
needs_repo = false
# --dangerously-skip-permissions is acceptable here and ONLY here: the blast
# radius is the container. Nothing run on the bare host uses it.
command = [
  "claude", "-p",
  "--dangerously-skip-permissions",
  "--output-format", "stream-json",
  "--include-partial-messages",
  "--verbose",
]
# How this CLI spells "start a session", "resume that session", and "take
# a system prompt". Placeholders: {session_id}, {agent_prompt}. Another
# agentic CLI spells these differently, which is why they are config.
session_flags = ["--session-id", "{session_id}"]
resume_flags = ["--resume", "{session_id}"]
system_prompt_flags = ["--append-system-prompt-file", "{agent_prompt}"]
# Wall-clock ceiling. Long-horizon work, so this is generous.
timeout_seconds = 14400

[agents.hermes]
type = "http_openai"
description = "A fast local model for questions and lookups that need no repository and no file access. Cheap and immediate; cannot do coding work."
# STUB. Point this at the real server and re-run bootstrap.sh; nothing else
# needs to change. The supervisor talks to it from the host, over loopback.
base_url = "http://127.0.0.1:8080/v1"
model = "hermes"
secrets_dir = "/run/orchestration/secrets/hermes"
# Optional: the file under secrets_dir holding a bearer token, if the server
# wants one. Absent means the request goes out unauthenticated.
api_key_file = "api_key"
needs_repo = false
timeout_seconds = 300
max_tokens = 2048

# A second harness, as an example. Uncomment, add the tool to the image and
# a matching service to docker-compose.yml, and it works like any other --
# no code changes. An agent with no resume_flags simply has no sessions:
# reply() says so plainly rather than failing strangely.
#
# [agents.codex]
# type = "container"
# description = "OpenAI's coding CLI. A second opinion on the same worktree."
# container = "orch-codex"
# secrets_dir = "/run/orchestration/secrets/codex"
# default_repo = "main"
# needs_repo = true
# command = ["codex", "exec", "--full-auto"]
# system_prompt_flags = ["--instructions-file", "{agent_prompt}"]
# timeout_seconds = 14400

# An agent on the bare host, outside any container. For work that genuinely
# needs the machine: bringing a compose stack up, reaching files outside a
# worktree, using something installed here and not in the image.
#
# Note what is missing: --dangerously-skip-permissions. That is acceptable
# where the blast radius is a container and nowhere else, so a local agent
# gets acceptEdits and an explicit list of what else it may do. Add to
# allowedTools deliberately; the backend refuses the dangerous flag outright.
#
# Uncomment to enable. It shares the claude-code identity's credentials by
# default -- give it its own secrets_dir if you would rather it did not.
#
# [agents.local]
# type = "local"
# description = "Runs on the desktop itself rather than in a container. For work that needs the machine: starting services, reaching files outside a repository, using tools installed on the host. Less sandboxed, so it asks permission for anything beyond editing."
# secrets_dir = "/run/orchestration/secrets/claude-code"
# needs_repo = false
# command = [
#   "claude", "-p",
#   "--permission-mode", "acceptEdits",
#   "--allowedTools", "Read Edit Write Glob Grep Bash(git *) Bash(docker *) Bash(python3 *)",
#   "--output-format", "stream-json",
#   "--verbose",
# ]
# session_flags = ["--session-id", "{session_id}"]
# resume_flags = ["--resume", "{session_id}"]
# system_prompt_flags = ["--append-system-prompt-file", "{agent_prompt}"]
# timeout_seconds = 14400

# Agents running on AWS Bedrock AgentCore. Nothing is checked out and
# nothing runs here: a message goes out and an answer comes back. The
# job's own session id is reused as the runtime session, so replying
# continues the same conversation rather than starting a new one.
#
# The ARNs are identifiers, not secrets. The credentials to invoke them
# are in 1Password; see .env.example.

[agents.soren]
type = "bedrock_agentcore"
description = "A PharmacyChecker agent on AWS, with its own access to that product. Delegate PharmacyChecker work to it and relay what it says -- it does the work itself. It cannot touch this machine, and its repositories are not checked out here."
harness_arn = "arn:aws:bedrock-agentcore:us-east-1:824683096545:harness/Soren-RSXzGGYQaQ"
region = "us-east-1"
secrets_dir = "/run/orchestration/secrets/agentcore"
needs_repo = false
timeout_seconds = 600

[agents.vesper]
type = "bedrock_agentcore"
description = "Owns deployments for the PharmacyChecker repositories -- the API, the website and the rest. Ask it about pending changes or to ship something; it does the work itself. Never open those repositories here; Vesper handles them."
harness_arn = "arn:aws:bedrock-agentcore:us-east-1:824683096545:harness/Vesper-CVQBrrztvd"
region = "us-east-1"
secrets_dir = "/run/orchestration/secrets/agentcore"
needs_repo = false
timeout_seconds = 600
