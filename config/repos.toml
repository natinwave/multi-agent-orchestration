# Repos an agent may be pointed at.
#
# `ask()` takes a free-text repo string and resolves it against these names
# and aliases, so you can say "the kiln one" out loud rather than a path.
# When two entries tie, ask() refuses and returns the candidates instead of
# guessing -- the voice model can then ask you which you meant.
#
# A job with no repo is not an error: it gets a scratch directory instead of
# a worktree. Plenty of questions need no checkout at all.
#
# HTTPS rather than SSH: the orchestration host has no SSH key, and giving
# it one would be a second credential to manage outside 1Password. Private
# repos are reached with GH_TOKEN instead.

[repos.main]
url = "https://github.com/natinwave/multi-agent-orchestration.git"
base_ref = "main"
aliases = ["orchestration", "the orchestrator", "this repo", "multi agent"]

